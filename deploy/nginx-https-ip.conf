# Replace every 192.0.2.10 with the monitor's public IPv4 address.
# Use only AFTER obtaining the browser-trusted phm-ip certificate.
server {
    listen 80;
    server_name 192.0.2.10;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/proxmox-host-monitor-acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location / { return 308 https://192.0.2.10$request_uri; }
}

server {
    listen 443 ssl;
    server_name 192.0.2.10;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/phm-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phm-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PHMTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 64k;

    # Prevent unexpected Host values reaching the application.
    if ($host != "192.0.2.10") { return 444; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host 192.0.2.10;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gunicorn recognizes these too; discard values supplied by clients.
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-SSL "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_redirect off;
    }
}
