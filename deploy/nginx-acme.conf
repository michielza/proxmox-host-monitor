# Bootstrap only: replace 192.0.2.10 with the monitor's public IPv4 address.
# Install after checking port 80 and existing nginx sites.
server {
    listen 80;
    server_name 192.0.2.10;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/proxmox-host-monitor-acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    # Do not expose the application before verified HTTPS is ready.
    location / { return 404; }
}
